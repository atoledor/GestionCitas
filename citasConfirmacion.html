<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Citas - La Luna Roja Barbershop</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,700;0,900&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Montserrat', sans-serif; }
    .font-gotica { font-family: 'UnifrakturMaguntia', cursive; }

    .status-select {
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e5b757' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.5rem center;
      background-size: 1em;
      padding-right: 1.8rem;
    }

    .status-agendada { background-color: #2a2200; color: #e5b757; border-color: #554400; }
    .status-confirmada { background-color: #062c16; color: #34d399; border-color: #0b5e30; }
    .status-cancelada { background-color: #310a0e; color: #f87171; border-color: #6b141d; }

    body.is-updating, body.is-updating * { cursor: wait !important; }
  </style>
</head>
<body class="bg-[#0c0c0c] text-[#f0f0f0] min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- Encabezado / Logo -->
    <header class="relative flex flex-col md:flex-row items-center justify-between border-b border-[#262626] pb-4 pt-2">
      <div class="flex items-center gap-3 w-full md:w-auto justify-center md:justify-start mb-4 md:mb-0">
        <img src="logo.jpg" alt="La Luna Roja Logo" class="h-16 w-16 md:h-20 md:w-20 object-contain rounded-md border border-[#262626]">
        <div class="block md:hidden">
          <h1 class="text-3xl font-gotica text-[#d3122a]">la luna roja.</h1>
        </div>
      </div>

      <div class="text-center md:absolute md:left-1/2 md:-translate-x-1/2">
        <div class="text-[#e5b757] text-sm md:text-base tracking-widest">✦ 🌙 ✦</div>
        <h1 class="hidden md:block text-4xl font-gotica text-[#d3122a] tracking-wide drop-shadow-[0_2px_8px_rgba(211,18,42,0.3)]">
          la luna roja.
        </h1>
        <p class="text-xs md:text-sm font-black tracking-[0.3em] uppercase text-gray-300">
          GESTIÓN Y ESTADO DE CITAS
        </p>
      </div>

      <div class="hidden md:block w-20"></div>
    </header>

    <!-- Tabla -->
    <div class="bg-[#151515] p-6 rounded-lg border border-[#262626] shadow-2xl">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 border-b border-[#262626] pb-4">
        <div>
          <h2 class="text-xl font-bold text-[#e5b757] flex items-center gap-2">
            <span>✦</span> Modificar Estado de Citas
          </h2>
          <p class="text-xs text-gray-400 mt-1">Cambia el valor en la columna Estado para actualizar la fila existente.</p>
        </div>
        <button onclick="fetchAppointments()" id="refreshBtn" class="bg-[#262626] hover:bg-[#333333] text-gray-200 border border-gray-700 px-4 py-2 rounded text-xs uppercase tracking-wider font-semibold transition">
          Actualizar Tabla
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-[#0c0c0c] border-b border-[#262626] text-xs font-bold text-gray-400 uppercase tracking-wider">
              <th class="p-3">Fecha</th>
              <th class="p-3">Hora</th>
              <th class="p-3">Cliente</th>
              <th class="p-3">Servicio</th>
              <th class="p-3">Barbero</th>
              <th class="p-3">Estado</th>
            </tr>
          </thead>
          <tbody id="citasTable" class="text-sm divide-y divide-[#262626] text-gray-300">
            <!-- Dinámico -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzp5pi6kORcXzziLHNvL8t-6at1BBUJj8molRYYrvyz_pFbQRnMbKrjISmDJlfM3hfL/exec';
    let citasExistentes = [];

    document.addEventListener('DOMContentLoaded', fetchAppointments);

    async function fetchAppointments() {
      const tbody = document.getElementById('citasTable');
      tbody.innerHTML = '<tr><td colspan="6" class="p-6 text-center text-gray-500">Cargando citas...</td></tr>';

      try {
        const res = await fetch(SCRIPT_URL);
        const json = await res.json();
        citasExistentes = json.data || [];
        tbody.innerHTML = '';

        citasExistentes.forEach((cita, index) => {
          if (!cita.Cliente) return;

          const fechaFormateada = cita.Fecha ? new Date(cita.Fecha).toISOString().split('T')[0] : '';
          const estadoActual = (cita.Estado || 'Agendada').toUpperCase();

          let statusClass = 'status-agendada';
          if (estadoActual === 'CONFIRMADA') statusClass = 'status-confirmada';
          if (estadoActual === 'CANCELADA') statusClass = 'status-cancelada';

          const row = `<tr class="hover:bg-[#1a1a1a] transition">
            <td class="p-3 text-gray-400 font-mono">${fechaFormateada}</td>
            <td class="p-3 font-semibold text-[#e5b757] font-mono">${cita['Hora Inicio'] || cita.Hora || ''}</td>
            <td class="p-3 font-medium text-white">${cita.Cliente}</td>
            <td class="p-3 text-gray-300">${cita.Servicio}</td>
            <td class="p-3 text-gray-300">${cita.Barbero}</td>
            <td class="p-3">
              <select 
                onchange="cambiarEstadoCita(this, ${index})" 
                class="status-select ${statusClass} text-xs font-bold px-3 py-1.5 rounded border transition cursor-pointer outline-none">
                <option value="Agendada" class="bg-[#151515] text-[#e5b757]" ${estadoActual === 'AGENDADA' ? 'selected' : ''}>AGENDADA</option>
                <option value="CONFIRMADA" class="bg-[#151515] text-[#34d399]" ${estadoActual === 'CONFIRMADA' ? 'selected' : ''}>CONFIRMADA</option>
                <option value="Cancelada" class="bg-[#151515] text-[#f87171]" ${estadoActual === 'CANCELADA' ? 'selected' : ''}>CANCELADA</option>
              </select>
            </td>
          </tr>`;
          tbody.innerHTML += row;
        });
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-red-500">Error al cargar citas</td></tr>';
      }
    }

    async function cambiarEstadoCita(selectElement, index) {
      const nuevoEstado = selectElement.value;
      const cita = citasExistentes[index];

      // Cambiar clases de color
      selectElement.classList.remove('status-agendada', 'status-confirmada', 'status-cancelada');
      if (nuevoEstado.toUpperCase() === 'CONFIRMADA') selectElement.classList.add('status-confirmada');
      else if (nuevoEstado.toUpperCase() === 'CANCELADA') selectElement.classList.add('status-cancelada');
      else selectElement.classList.add('status-agendada');

      document.body.classList.add('is-updating');
      selectElement.disabled = true;

      // Se envía 'action: UPDATE_ESTADO' indicando qué registro buscar
      const payload = {
        action: "UPDATE_ESTADO",
        cliente: cita.Cliente,
        fecha: cita.Fecha ? new Date(cita.Fecha).toISOString().split('T')[0] : '',
        horaInicio: cita['Hora Inicio'] || cita.Hora,
        estado: nuevoEstado
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        citasExistentes[index].Estado = nuevoEstado;
      } catch (err) {
        alert('Error al modificar el estado');
      } finally {
        document.body.classList.remove('is-updating');
        selectElement.disabled = false;
      }
    }
  </script>
</body>
</html>
