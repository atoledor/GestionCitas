<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Citas - La Luna Roja Barbershop</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,700;0,900&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  
  <!-- Estilos Personalizados -->
  <link rel="stylesheet" href="confirmacion.css">
</head>
<body class="bg-[#0c0c0c] text-[#f0f0f0] min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- Encabezado / Logo -->
    <header class="relative flex flex-col md:flex-row items-center justify-between border-b border-[#262626] pb-4 pt-2">
      <div class="flex items-center gap-3 w-full md:w-auto justify-center md:justify-start mb-4 md:mb-0">
        <div class="block md:hidden">
          <h1 class="text-3xl font-gotica text-[#d3122a]">la luna roja.</h1>
        </div>
      </div>

      <div class="text-center md:absolute md:left-1/2 md:-translate-x-1/2">
        <div class="text-[#e5b757] text-sm md:text-base tracking-widest">✦ 🌙 ✦</div>
        <h1 class="hidden md:block text-4xl font-gotica text-[#d3122a] tracking-wide drop-shadow-[0_2px_8px_rgba(211,18,42,0.3)]">
          la luna roja.
        </h1>
        <p class="text-xs md:text-sm font-black tracking-[0.3em] uppercase text-gray-300">
          GESTIÓN Y ESTADO DE CITAS
        </p>
      </div>

      <div class="hidden md:block w-20"></div>
    </header>

    <!-- Tabla -->
    <div class="bg-[#151515] p-6 rounded-lg border border-[#262626] shadow-2xl">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 border-b border-[#262626] pb-4">
        <div>
          <h2 class="text-xl font-bold text-[#e5b757] flex items-center gap-2">
            <span>✦</span> Modificar Estado de Citas
          </h2>
          <p class="text-xs text-gray-400 mt-1">Ordena las filas de forma ascendente.</p>
        </div>
        <button id="refreshBtn" class="bg-[#262626] hover:bg-[#333333] text-gray-200 border border-gray-700 px-4 py-2 rounded text-xs uppercase tracking-wider font-semibold transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
          Actualizar Tabla
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-[#0c0c0c] border-b border-[#262626] text-xs font-bold text-gray-400 uppercase tracking-wider">
              <th class="p-3">Fecha</th>
              <th class="p-3">Hora</th>
              <th class="p-3">Cliente</th>
              <th class="p-3">Teléfono</th>
              <th class="p-3">Servicio</th>
              <th class="p-3">Barbero</th>
              <th class="p-3">Estado</th>
            </tr>
          </thead>
          <tbody id="citasTable" class="text-sm divide-y divide-[#262626] text-gray-300">
            <!-- Dinámico -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Pop-Up de Confirmación -->
  <div id="popupModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300 z-50">
    <div class="bg-[#151515] border border-[#e5b757]/40 rounded-xl p-6 max-w-sm w-full text-center shadow-2xl transform scale-95 transition-transform duration-300 id-modal-card">
      <div class="w-12 h-12 bg-[#062c16] text-[#34d399] border border-[#0b5e30] rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
        ✓
      </div>
      <h3 class="text-lg font-bold text-white mb-2">¡Actualización Exitosa!</h3>
      <p class="text-sm text-gray-300 mb-6">se ha modificado el estatus</p>
      <button id="closePopupBtn" class="w-full bg-[#e5b757] hover:bg-[#c99f46] text-[#0c0c0c] font-bold py-2.5 px-4 rounded-lg text-xs uppercase tracking-wider transition">
        Aceptar
      </button>
    </div>
  </div>

  <!-- Script JavaScript -->
  <script src="confirmacion.js"></script>
</body>
</html>
