<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Citas - La Luna Roja Barbershop</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: UnifrakturMaguntia (Gótica) y Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,700;0,900&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <!-- Archivo CSS Personalizado -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0c0c0c] text-[#f0f0f0] min-h-screen p-4 md:p-8 relative">

  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- Encabezado / Logo Header -->
    <header class="relative flex flex-col md:flex-row items-center justify-between border-b border-[#262626] pb-4 pt-2">
      
      <!-- LOGO EN LA PARTE SUPERIOR IZQUIERDA -->
      <div class="flex items-center gap-3 w-full md:w-auto justify-center md:justify-start mb-4 md:mb-0">
        <div class="block md:hidden">
          <h1 class="text-3xl font-gotica text-[#d3122a]">la luna roja.</h1>
        </div>
      </div>

      <!-- TÍTULO PRINCIPAL -->
      <div class="text-center md:absolute md:left-1/2 md:-translate-x-1/2">
        <div class="text-[#e5b757] text-sm md:text-base tracking-widest">✦ 🌙 ✦</div>
        <h1 class="hidden md:block text-4xl font-gotica text-[#d3122a] tracking-wide drop-shadow-[0_2px_8px_rgba(211,18,42,0.3)]">
          la luna roja.
        </h1>
        <p class="text-xs md:text-sm font-black tracking-[0.3em] uppercase text-gray-300">
          BARBERSHOP &bull; CITAS
        </p>
      </div>

      <div class="hidden md:block w-20"></div>
    </header>

    <!-- Formulario para Guardar Citas -->
    <div class="bg-[#151515] p-6 rounded-lg border border-[#262626] shadow-2xl">
      <h2 class="text-xl font-bold mb-6 text-[#e5b757] flex items-center gap-2 border-b border-[#262626] pb-3">
        <span>✦</span> Registrar Nueva Cita
      </h2>
      
      <form id="appointmentForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="cliente" placeholder="Nombre del Cliente" required class="custom-input p-3 rounded text-sm">
        <input type="tel" id="telefono" placeholder="Teléfono / WhatsApp" required class="custom-input p-3 rounded text-sm">
        
        <!-- Fecha -->
        <input type="date" id="fecha" required class="custom-input p-3 rounded text-sm">
        
        <!-- Selector Único de Horario -->
        <select id="hora" class="custom-input p-3 rounded text-sm" required disabled>
          <option value="" disabled selected>Selecciona primero una fecha</option>
          <option value="9:00 am">9:00 am</option>
          <option value="9:30 am">9:30 am</option>
          <option value="10:00 am">10:00 am</option>
          <option value="10:30 am">10:30 am</option>
          <option value="11:00 am">11:00 am</option>
          <option value="11:30 am">11:30 am</option>
          <option value="12:00 pm">12:00 pm</option>
          <option value="12:30 pm">12:30 pm</option>
          <option value="1:00 pm">1:00 pm</option>
          <option value="1:30 pm">1:30 pm</option>
          <option value="2:00 pm">2:00 pm</option>
          <option value="2:30 pm">2:30 pm</option>
          <option value="3:00 pm">3:00 pm</option>
          <option value="3:30 pm">3:30 pm</option>
          <option value="4:00 pm">4:00 pm</option>
          <option value="4:30 pm">4:30 pm</option>
          <option value="5:00 pm">5:00 pm</option>
          <option value="5:30 pm">5:30 pm</option>
          <option value="6:00 pm">6:00 pm</option>
          <option value="6:30 pm">6:30 pm</option>
          <option value="7:00 pm">7:00 pm</option>
          <option value="7:30 pm">7:30 pm</option>
          <option value="8:00 pm">8:00 pm</option>
          <option value="8:30 pm">8:30 pm</option>
          <option value="9:00 pm">9:00 pm</option>
        </select>

        <select id="servicio" class="custom-input p-3 rounded text-sm" required>
          <option value="">Seleccionar Servicio</option>
          <option value="Corte Clásico">Corte Clásico</option>
          <option value="Corte Barba">Corte Barba</option>
          <option value="Corte Infantil">Corte Infantil</option>
        </select>
        
        <select id="barbero" class="custom-input p-3 rounded text-sm" required>
          <option value="">Seleccionar Barbero</option>
          <option value="Ricardo">Ricardo/Dino</option>
          <option value="Carlos">El Wero</option>
        </select>
        
        <input type="number" id="precio" placeholder="Precio ($)" value="150" disabled class="custom-input p-3 rounded text-sm font-semibold text-[#e5b757]">
        
        <select id="metodoPago" class="custom-input p-3 rounded text-sm" required>
          <option value="">Tipo de Pago</option>
          <option value="Efectivo">Efectivo</option>
          <option value="Transferencia">Transferencia</option>
        </select>
        
        <textarea id="notas" placeholder="Notas o preferencias del cliente" class="md:col-span-2 custom-input p-3 rounded text-sm h-24"></textarea>
        
        <!-- Botón de Envío -->
        <button type="submit" id="submitBtn" class="md:col-span-2 bg-[#d3122a] hover:bg-[#b00e22] text-white font-bold py-3 rounded uppercase tracking-wider transition-all duration-300 shadow-lg shadow-red-900/30 mt-2 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
          <span id="btnText">Guardar Cita</span>
        </button>
      </form>
    </div>

    <!-- Tabla para Consultar Citas -->
    <div class="bg-[#151515] p-6 rounded-lg border border-[#262626] shadow-2xl">
      <div class="flex justify-between items-center mb-6 border-b border-[#262626] pb-3">
        <h2 class="text-xl font-bold text-[#e5b757] flex items-center gap-2">
          <span>✦</span> Lista de Citas
        </h2>
        <button id="refreshBtn" class="bg-[#262626] hover:bg-[#333333] text-gray-200 border border-gray-700 px-4 py-1.5 rounded text-xs uppercase tracking-wider font-semibold transition disabled:opacity-50">
          Actualizar
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-[#0c0c0c] border-b border-[#262626] text-xs font-bold text-gray-400 uppercase tracking-wider">
              <th class="p-3">Fecha</th>
              <th class="p-3">Hora</th>
              <th class="p-3">Cliente</th>
              <th class="p-3">Servicio</th>
              <th class="p-3">Barbero</th>
              <th class="p-3">Estado</th>
            </tr>
          </thead>
          <tbody id="citasTable" class="text-sm divide-y divide-[#262626] text-gray-300">
            <!-- Cargas dinámicas aquí -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL / POPUP PERSONALIZADO -->
  <div id="customModal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
    <!-- Backdrop oscuro -->
    <div id="modalBackdrop" class="modal-backdrop fixed inset-0 bg-black/80 backdrop-blur-sm opacity-0"></div>
    
    <!-- Contenido del Modal -->
    <div id="modalContent" class="modal-content relative bg-[#151515] border border-[#e5b757] rounded-xl p-6 md:p-8 max-w-sm w-11/12 mx-auto text-center shadow-[0_10px_30px_rgba(211,18,42,0.3)] transform scale-95 opacity-0 z-10">
      
      <!-- Icono Dinámico (Éxito / Advertencia / Error) -->
      <div id="modalIconContainer" class="w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4 border border-[#e5b757]/30 bg-[#262626]">
        <span id="modalIcon" class="text-3xl">🌙</span>
      </div>

      <!-- Título del Modal -->
      <h3 id="modalTitle" class="text-xl font-bold font-gotica text-[#e5b757] mb-2 tracking-wide">
        La Luna Roja
      </h3>

      <!-- Mensaje Principal -->
      <p id="modalMessage" class="text-sm text-gray-300 mb-6 leading-relaxed">
        Mensaje del sistema.
      </p>

      <!-- Botón Entendido / Cerrar -->
      <button id="closeModalBtn" class="w-full bg-[#d3122a] hover:bg-[#b00e22] text-white font-bold py-2.5 rounded-lg uppercase tracking-wider text-xs transition-all duration-300 shadow-md hover:shadow-red-900/50">
        Aceptar
      </button>
    </div>
  </div>

  <!-- Archivo JavaScript Personalizado -->
  <script src="script.js"></script>
</body>
</html>
