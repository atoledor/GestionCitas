<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Citas - La Luna Roja Barbershop</title>

  <!-- Tailwind CSS (Versión CSS estática compatible con WebKit/iOS) -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,700;0,900&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  <!-- vConsole: Muestra la consola de errores directamente en la pantalla del iPhone -->
  <script src="https://cdn.jsdelivr.net/npm/vconsole@latest/dist/vconsole.min.js"></script>
  <script>
    if (typeof VConsole !== 'undefined') {
      window.vConsole = new VConsole();
    }
  </script>

  <!-- Archivo CSS Personalizado -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8 relative">

  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- Encabezado -->
    <header class="relative flex flex-col md:flex-row items-center justify-between border-b border-gray-800 pb-4 pt-2">
      <div class="flex items-center gap-3 w-full md:w-auto justify-center md:justify-start mb-4 md:mb-0">
        <div class="block md:hidden">
          <h1 class="text-3xl font-bold text-red-600">la luna roja.</h1>
        </div>
      </div>

      <div class="text-center md:absolute md:left-1/2 md:-translate-x-1/2">
        <div class="text-yellow-500 text-sm md:text-base tracking-widest">✦ 🌙 ✦</div>
        <h1 class="hidden md:block text-4xl font-bold text-red-600 tracking-wide">
          la luna roja.
        </h1>
        <p class="text-xs md:text-sm font-black tracking-widest uppercase text-gray-300">
          BARBERSHOP &bull; CITAS
        </p>
      </div>

      <div class="hidden md:block w-20"></div>
    </header>

    <!-- Formulario para Guardar Citas -->
    <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-2xl">
      <h2 class="text-xl font-bold mb-6 text-yellow-500 flex items-center gap-2 border-b border-gray-700 pb-3">
        <span>✦</span> Registrar Nueva Cita
      </h2>
      
      <form id="appointmentForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="cliente" placeholder="Nombre del Cliente" required class="custom-input p-3 rounded text-sm bg-gray-900 border border-gray-700 text-white">
        <input type="tel" id="telefono" placeholder="Teléfono / WhatsApp" required class="custom-input p-3 rounded text-sm bg-gray-900 border border-gray-700 text-white">
        
        <!-- Fecha -->
        <input type="date" id="fecha" required class="custom-input p-3 rounded text-sm bg-gray-900 border border-gray-700 text-white">
        
        <!-- Selector Único de Horario -->
        <select id="hora" class="custom-input p-3 rounded text-sm bg-gray-900 border border-gray-700 text-white" required disabled>
          <option value="" disabled selected>Selecciona primero una fecha</option>
          <option value="9:00 am">9:00 am</option>
          <option value="9:30 am">9:30 am</option>
          <option value="10:00 am">10:00 am</option>
          <option value="10:30 am">10:30 am</option>
          <option value="11:00 am">11:00 am</option>
          <option value="11:30 am">11:30 am</option>
          <option value="12:00 pm">12:00 pm</option>
          <option value="12:30 pm">12:30 pm</option>
          <option value="1:00 pm">1:00 pm</option>
          <option value="1:30 pm">1:30 pm</option>
          <option value="2:00 pm">2:00 pm</option>
          <option value="2:30 pm">2:30 pm</option>
          <option value="3:00 pm">3:00 pm</option>
          <option value="3:30 pm">3:30 pm</option>
          <option value="4:00 pm">4:00 pm</option>
          <option value="4:30 pm">4:30 pm</option>
          <option value="5:00 pm">5:00 pm</option>
          <option value="5:30 pm">5:30 pm</option>
          <option value="6:00 pm">6:00 pm</option>
          <option value="6:30 pm">6:30 pm</option>
          <option value="7:00 pm">7:00 pm</option>
          <option value="7:30 pm">7:30 pm</option>
          <option value="8:00 pm">8:00 pm</option>
          <option value="8:30 pm">8:30 pm</option>
          <option value="9:00 pm">9:00 pm</option>
        </select>

        <select id="servicio" class="custom-input p-3 rounded text-sm bg-gray-900 border border-gray-700 text-white" required>
          <option value="">Seleccionar Servicio</option>
          <option value="Corte Clásico">Corte Clásico</option>
          <option value="Corte Barba">Corte Barba</option>
          <option value="Corte Infantil">Corte Infantil</option>
        </select>
        
        <select id="barbero" class="custom-input p-3 rounded text-sm bg-gray-900 border border-gray-700 text-white" required>
          <option value="">Seleccionar Barbero</option>
          <option value="Ricardo">Ricardo/Dino</option>
          <option value="Carlos">El Wero</option>
        </select>
        
        <input type="number" id="precio" placeholder="Precio ($)" value="150" disabled class="custom-input p-3 rounded text-sm font-semibold text-yellow-500 bg-gray-900 border border-gray-700">
        
        <select id="metodoPago" class="custom-input p-3 rounded text-sm bg-gray-900 border border-gray-700 text-white" required>
          <option value="">Tipo de Pago</option>
          <option value="Efectivo">Efectivo</option>
          <option value="Transferencia">Transferencia</option>
        </select>
        
        <textarea id="notas" placeholder="Notas o preferencias del cliente" class="md:col-span-2 custom-input p-3 rounded text-sm h-24 bg-gray-900 border border-gray-700 text-white"></textarea>
        
        <button type="submit" id="submitBtn" class="md:col-span-2 bg-red-700 hover:bg-red-800 text-white font-bold py-3 rounded uppercase tracking-wider transition-all duration-300 mt-2 flex items-center justify-center gap-2">
          <span id="btnText">Guardar Cita</span>
        </button>
      </form>
    </div>

    <!-- Tabla para Consultar Citas -->
    <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-2xl">
      <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-3">
        <h2 class="text-xl font-bold text-yellow-500 flex items-center gap-2">
          <span>✦</span> Lista de Citas
        </h2>
        <button id="refreshBtn" class="bg-gray-700 hover:bg-gray-600 text-gray-200 border border-gray-600 px-4 py-1.5 rounded text-xs uppercase tracking-wider font-semibold transition">
          Actualizar
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-900 border-b border-gray-700 text-xs font-bold text-gray-400 uppercase tracking-wider">
              <th class="p-3">Fecha</th>
              <th class="p-3">Hora</th>
              <th class="p-3">Cliente</th>
              <th class="p-3">Servicio</th>
              <th class="p-3">Barbero</th>
              <th class="p-3">Estado</th>
            </tr>
          </thead>
          <tbody id="citasTable" class="text-sm divide-y divide-gray-700 text-gray-300">
            <!-- Cargas dinámicas aquí -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL / POPUP PERSONALIZADO -->
  <div id="customModal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
    <div id="modalBackdrop" class="fixed inset-0 bg-black bg-opacity-80 transition-opacity"></div>
    
    <div id="modalContent" class="relative bg-gray-800 border border-yellow-500 rounded-xl p-6 md:p-8 max-w-sm w-11/12 mx-auto text-center shadow-2xl z-10">
      <div id="modalIconContainer" class="w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4 border border-yellow-500 bg-gray-900">
        <span id="modalIcon" class="text-3xl">🌙</span>
      </div>

      <h3 id="modalTitle" class="text-xl font-bold text-yellow-500 mb-2">
        La Luna Roja
      </h3>

      <p id="modalMessage" class="text-sm text-gray-300 mb-6">
        Mensaje del sistema.
      </p>

      <button id="closeModalBtn" class="w-full bg-red-700 hover:bg-red-800 text-white font-bold py-2.5 rounded-lg uppercase tracking-wider text-xs transition-all">
        Aceptar
      </button>
    </div>
  </div>

  <!-- Archivo JavaScript Personalizado con carga diferida segura -->
  <script src="script.js" defer></script>
</body>
</html>
