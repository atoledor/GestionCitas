<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Citas - Barbería</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Encabezado -->
    <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Sistema de Citas</h1>

    <!-- Formulario para Guardar Citas -->
    <div class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-xl font-semibold mb-4 text-gray-700">Registrar Nueva Cita</h2>
      <form id="appointmentForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="cliente" placeholder="Nombre Cliente" required class="p-2 border rounded">
        <input type="tel" id="telefono" placeholder="Teléfono / WhatsApp" class="p-2 border rounded">
        <input type="date" id="fecha" required class="p-2 border rounded">
        <div class="grid grid-cols-2 gap-2">
          <input type="time" id="horaInicio" required class="p-2 border rounded">
          <input type="time" id="horaFin" required class="p-2 border rounded">
        </div>
        <select id="servicio" class="p-2 border rounded" required>
          <option value="">Seleccionar Servicio</option>
          <option value="Corte Clásico">Corte Clásico</option>
          <option value="Corte + Barba">Corte + Barba</option>
          <option value="Corte Infantil">Corte Infantil</option>
        </select>
        <select id="barbero" class="p-2 border rounded" required>
          <option value="Ricardo">Ricardo</option>
          <!-- <option value="Carlos López">Carlos López</option>
          <option value="María Rodríguez">María Rodríguez</option>-->
        </select>
        <input type="number" id="precio" placeholder="Precio ($)" class="p-2 border rounded">
        <select id="metodoPago" class="p-2 border rounded">
          <option value="Efectivo">Efectivo</option>
          <!--<option value="Tarjeta">Tarjeta</option>-->
          <option value="Transferencia">Transferencia</option>
        </select>
        <textarea id="notas" placeholder="Notas o preferencias" class="md:col-span-2 p-2 border rounded"></textarea>
        <button type="submit" class="md:col-span-2 bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Guardar Cita</button>
      </form>
    </div>

    <!-- Tabla para Consultar Citas -->
    <div class="bg-white p-6 rounded-lg shadow-md">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold text-gray-700">Lista de Citas</h2>
        <button onclick="fetchAppointments()" class="bg-gray-800 text-white px-4 py-1 rounded text-sm">Actualizar</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 border-b text-sm font-medium text-gray-600">
              <th class="p-2">Fecha</th>
              <th class="p-2">Hora</th>
              <th class="p-2">Cliente</th>
              <th class="p-2">Servicio</th>
              <th class="p-2">Barbero</th>
              <th class="p-2">Estado</th>
            </tr>
          </thead>
          <tbody id="citasTable" class="text-sm divide-y">
            <!-- Cargas dinámicas aquí -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzp5pi6kORcXzziLHNvL8t-6at1BBUJj8molRYYrvyz_pFbQRnMbKrjISmDJlfM3hfL/exec';

    // Cargar citas al iniciar
    document.addEventListener('DOMContentLoaded', fetchAppointments);

    // Obtener citas (GET)
    async function fetchAppointments() {
      const tbody = document.getElementById('citasTable');
      tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center">Cargando...</td></tr>';
      
      try {
        const res = await fetch(SCRIPT_URL);
        const json = await res.json();
        
        tbody.innerHTML = '';
        json.data.forEach(cita => {
          if (!cita.Cliente) return;
          const row = `<tr>
            <td class="p-2">${cita.Fecha ? new Date(cita.Fecha).toLocaleDateString() : ''}</td>
            <td class="p-2">${cita['Hora Inicio'] || ''}</td>
            <td class="p-2 font-medium">${cita.Cliente}</td>
            <td class="p-2">${cita.Servicio}</td>
            <td class="p-2">${cita.Barbero}</td>
            <td class="p-2"><span class="px-2 py-1 rounded text-xs bg-yellow-100 text-yellow-800">${cita.Estado}</span></td>
          </tr>`;
          tbody.innerHTML += row;
        });
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-red-500">Error al cargar datos</td></tr>';
      }
    }

    // Guardar cita (POST)
    document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const payload = {
        cliente: document.getElementById('cliente').value,
        telefono: document.getElementById('telefono').value,
        fecha: document.getElementById('fecha').value,
        horaInicio: document.getElementById('horaInicio').value,
        horaFin: document.getElementById('horaFin').value,
        servicio: document.getElementById('servicio').value,
        barbero: document.getElementById('barbero').value,
        precio: document.getElementById('precio').value,
        metodoPago: document.getElementById('metodoPago').value,
        notas: document.getElementById('notas').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // Evita bloqueos de CORS estándar de Apps Script
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert('Cita enviada con éxito');
        document.getElementById('appointmentForm').reset();
        setTimeout(fetchAppointments, 1500); // Recargar tabla
      } catch (err) {
        alert('Error al guardar la cita');
      }
    });
  </script>
</body>
</html>
